name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://offerline:offerline@127.0.0.1:5432/offerline?sslmode=disable
      DIRECT_URL: postgresql://offerline:offerline@127.0.0.1:5432/offerline?sslmode=disable
      OFFERLINE_API_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm run prisma:validate

      - name: Prisma generate
        run: pnpm run prisma:generate

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm test

      - name: Build API application
        run: pnpm run build:api

      - name: Build web application
        run: pnpm run build:web

      - name: Production dependency audit
        run: pnpm audit --prod
